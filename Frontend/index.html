<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wina Bwangu — New Transaction</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-shell">

    <!-- Sidebar Navigation -->
    <nav class="sidenav" aria-label="Main navigation">
      <div class="sidenav-brand">
        <span class="sidenav-brand-mark">WB</span>
        <span class="sidenav-brand-name">Wina Bwangu</span>
      </div>
      <ul class="sidenav-links">
        <li><a href="index.html" class="sidenav-link sidenav-link--active" aria-current="page">New Transaction</a></li>
        <li><a href="dashboard.html" class="sidenav-link">Dashboard</a></li>
      </ul>
    </nav>

    <!-- Main Content Area -->
    <div class="main-column">

      <header class="page-header">
        <h1>Record New Transaction</h1>
        <p class="page-subtitle">Select mobile booth and service to process transaction</p>
      </header>

      <main>
        <div id="formMessage"></div>

        <section class="panel form-panel">
          <form id="transactionForm">

            <!-- Mobile Booth Dropdown -->
            <div class="form-group">
              <label for="booth">Mobile Booth</label>
              <select id="booth" class="form-input" required>
                <option value="">-- Select Mobile Booth --</option>
                <option value="Wina1">Wina1 (Lusaka CPD)</option>
                <option value="Wina2">Wina2 (Libala)</option>
                <option value="Wina3">Wina3 (Kabwata)</option>
                <option value="Wina4">Wina4 (Mandevu)</option>
                <option value="Wina5">Wina5 (Woodlands)</option>
                <option value="Wina6">Wina6 (Matero East)</option>
              </select>
            </div>

            <!-- Location (Auto-populated) -->
            <div class="form-group">
              <label for="location">Location</label>
              <input type="text" id="location" class="form-input" readonly placeholder="Auto-populated on selection">
            </div>

            <!-- Cascading Service Dropdown -->
            <div class="form-group">
              <label for="service">Service Offered</label>
              <select id="service" class="form-input" required>
                <option value="">-- Select Booth First --</option>
              </select>
            </div>

            <!-- Revenue Rate (Auto-populated) -->
            <div class="form-group">
              <label for="revenue">Revenue Per Kwacha</label>
              <input type="text" id="revenue" class="form-input" readonly placeholder="0.00">
            </div>

            <!-- Transaction Amount -->
            <div class="form-group">
              <label for="amount">Transaction Amount (ZMW)</label>
              <input type="number" id="amount" class="form-input" min="1" step="any" placeholder="Enter amount" required>
            </div>

            <button type="submit" class="btn-primary">Submit Transaction</button>
          </form>
        </section>
      </main>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
