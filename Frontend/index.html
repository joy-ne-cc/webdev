<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wina Bwangu - Transaction Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Wina Bwangu Transaction Form</h1>

        <form id="transactionForm">

            <label for="transactionID">Transaction ID:</label>
            <input type="text" id="transactionID" name="transactionID" placeholder="Auto-generated later" readonly>

            <label for="booth">Mobile Booth:</label>
            <select id="booth" name="booth" required>
                <option value="">Select Booth</option>
                <option value="Wina1">Wina1</option>
                <option value="Wina2">Wina2</option>
                <option value="Wina3">Wina3</option>
                <option value="Wina4">Wina4</option>
                <option value="Wina5">Wina5</option>
                <option value="Wina6">Wina6</option>
            </select>

            <label for="location">Location:</label>
            <input type="text" id="location" name="location" readonly placeholder="Location will appear here">

            <label for="service">Service:</label>
            <select id="service" name="service" required>
                <option value="">Select Service</option>
            </select>

            <label for="revenue">Revenue per Kwacha:</label>
            <input type="text" id="revenue" name="revenue" readonly placeholder="Select a service">

            <label for="amount">Transaction Amount (ZMW):</label>
            <input type="number" id="amount" name="amount" required min="1" step="0.01" placeholder="Enter amount">

            <button type="submit">Submit Transaction</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
